name: Evaluation run

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full corpus evaluation
        # mock only until live mode exists (Project 2); run_eval.py rejects other modes
        run: python scripts/run_eval.py --corpus data/corpus.jsonl --mode mock --report out/report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: out/report.md
